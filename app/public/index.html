<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App Info</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-green-light">
  <main class="d-flex min-vh-100 align-items-center justify-content-center p-3">
    <div class="card shadow" style="max-width: 640px; width: 100%;">
      <div class="card-body">
        <h1 class="h4 mb-3">Application Info</h1>
        <div class="row g-2 align-items-center">
          <div class="col-12 col-sm-4 text-muted">Hostname</div>
          <div class="col-12 col-sm-8 fw-semibold" id="hostname">Loading…</div>
          <div class="col-12 col-sm-4 text-muted">Version</div>
          <div class="col-12 col-sm-8 fw-semibold" id="version">Loading…</div>
        </div>
        <p class="text-danger mt-3 mb-0" id="error"></p>
      </div>
    </div>
  </main>
  <script>
    function setError(message) {
      document.getElementById('error').textContent = message;
    }

    function loadInfo() {
      fetch('/api/info')
        .then(r => {
          if (!r.ok) throw new Error('Failed to fetch /api/info');
          return r.json();
        })
        .then(d => {
          document.getElementById('hostname').textContent = d.hostname;
          document.getElementById('version').textContent = d.version;
        })
        .catch(() => setError('Failed to load info'));
    }

    loadInfo();
  </script>
</body>

</html>
