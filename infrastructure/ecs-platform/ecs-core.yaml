AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
  #- AWS::CodeDeployBlueGreen
Description: "ECS Cluster and Task Definition for AWS DevOps Learning App"

Parameters:
  Project:
    Type: String
    Default: Devops ECS Blue/Green Deployment
    Description: Project name

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment name

  AppName:
    Type: String
    Default: ecs-demo
    Description: Application name

  DefaultImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy

  ContainerPort:
    Type: Number
    Default: 3000
    Description: Port on which the container listens

  ContainerCpu:
    Type: Number
    Default: 256
    Description: How much CPU to give the container. 1024 is 1 CPU
  ContainerMemory:
    Type: Number
    Default: 512
    Description: How much memory in megabytes to give the container

  DesiredCount:
    Type: Number
    Default: 0
    Description: Desired number of ECS tasks

  LogRetentionInDays:
    Type: Number
    Default: 1
    Description: Log group retention in days

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC ID to use for the infrastructure

  SubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First default subnet ID

  SubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second default subnet ID

  DeploymentType:
    Type: String
    Default: codedeploy
    AllowedValues: [codedeploy, cloudformation]
    Description: Deployment type for ECS service

Conditions:
  IsDeploymentWithCodeDeploy: !Equals [!Ref DeploymentType, codedeploy]
  IsDeploymentWithCodeDeployAndCICDEnvironment: !And
    - !Equals [!Ref DeploymentType, codedeploy]
    - !Equals [!Ref Environment, test]

  #IsDeploymentWithCloudFormation: !Equals [!Ref DeploymentType, cloudformation]

Resources:
  # ECR Repository
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Environment}-${AppName}-repo"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # Using Default VPC and Subnets
  # Note: This template uses the existing default VPC and its subnets
  # No VPC resources are created - we reference the existing default VPC

  # Security Groups
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Environment}-${AppName}-ecs-sg"
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-ecs-sg"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Environment}-${AppName}-alb-sg"
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-alb-sg"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # Application Load Balancer definitions
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Environment}-${AppName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref SubnetId1
        - !Ref SubnetId2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-alb"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TGBLUE
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # Listener Rule to swap traffic between target groups
  ALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: User-Agent
            Values:
              - "*"
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref TGBLUE
                Weight: 100
              - TargetGroupArn: !Ref TGGREEN
                Weight: 0

  # Two target groups for blue/green
  TGBLUE:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Environment}-${AppName}-tg-blue"
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-tg-blue"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  TGGREEN:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Environment}-${AppName}-tg-green"
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-tg-green"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Environment}-${AppName}-cluster"
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-cluster"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # ECS Task Definition
  BlueTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Environment}-${AppName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${Environment}-${AppName}-container"
          Image:
            !Join [
              ":",
              [!GetAtt ECRRepository.RepositoryUri, !Ref DefaultImageTag],
            ]
          Cpu: !Ref ContainerCpu
          Memory: !Ref ContainerMemory
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: NODE_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: !Ref ContainerPort

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${Environment}-${AppName}-service"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref BlueTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentController:
        Type: ECS # CODE_DEPLOY
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        MaximumPercent: 200
        MinimumHealthyPercent: 75
        BakeTimeInMinutes: 5
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref SubnetId1
            - !Ref SubnetId2
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: !Sub "${Environment}-${AppName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TGBLUE
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref TGGREEN
            ProductionListenerRule: !Ref ALBListenerRule
            RoleArn: !GetAtt ECSManageLoadBalancersRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-service"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Log Group
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${Environment}-${AppName}-app"
      RetentionInDays: !Ref LogRetentionInDays

  # CodeDeploy Application
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Condition: IsDeploymentWithCodeDeployAndCICDEnvironment
    Properties:
      ApplicationName: !Sub "${Environment}-${AppName}-blue-green-deployment-app"
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Condition: IsDeploymentWithCodeDeployAndCICDEnvironment
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${Environment}-${AppName}-deployment-group"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !GetAtt TGBLUE.TargetGroupName
              - Name: !GetAtt TGGREEN.TargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref ALBListener
      ECSServices:
        - ClusterName: !Ref ECSCluster
          ServiceName: !Ref ECSService
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${AppName}-deployment-group"
        - Key: App
          Value: !Ref AppName
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-ecs-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  ECSManageLoadBalancersRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: [ecs.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForLoadBalancers

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ECSLogGroup.Arn

  # CodeDeploy Service Role (required for CodeDeploy Blue/Green)
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Condition: IsDeploymentWithCodeDeployAndCICDEnvironment
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

Outputs:
  ECRRepositoryURI:
    Description: ECR Repository URI
    Value: !GetAtt ECRRepository.RepositoryUri

  ALBDNSName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  ContainerName:
    Description: ECS Container Name
    Value: !Sub "${Environment}-${AppName}-container"

  CodeDeployApplicationName:
    Description: CodeDeploy Application Name
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroupName:
    Description: CodeDeploy Deployment Group Name
    Value: !Ref CodeDeployDeploymentGroup
